workflows:
  android-workflow:
    name: Android Driver App
    max_build_duration: 60
    environment:
      groups:
        - Android_build
      vars:
        PACKAGE_NAME: "com.transportsligneo.driver"
      node: 22
      java: 21
      android_signing:
        - Ligneo-keystore
    scripts:
      - name: Version Android (auto-incrément)
        script: |
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          echo "versionCode calculé = $((4 + ${BUILD_NUMBER:-0}))"
      - name: Configurer Firebase Android
        script: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          encoded = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          if not encoded:
              raise SystemExit(
                  "GOOGLE_SERVICES_JSON manque dans le groupe Android_build. "
                  "Ajoutez-y google-services.json encodé en base64."
              )

          try:
              raw = base64.b64decode(encoded, validate=True)
              config = json.loads(raw)
          except Exception as exc:
              raise SystemExit("GOOGLE_SERVICES_JSON n'est pas un fichier Firebase base64 valide.") from exc

          package_names = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          }
          if "com.transportsligneo.driver" not in package_names:
              raise SystemExit(
                  "Le fichier Firebase ne contient pas l'app Android com.transportsligneo.driver."
              )

          Path("android/app/google-services.json").write_bytes(raw)
          print("Configuration Firebase Android installée et validée.")
          PY
      - name: Installer les dépendances
        script: npm install
      - name: Build de l'app web
        script: npm run build
      - name: Synchroniser Capacitor
        script: npx cap sync android
      - name: Générer le bundle Android
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
