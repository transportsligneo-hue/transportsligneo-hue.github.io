workflows:
  android-workflow:
    name: Android Driver App
    max_build_duration: 60
    environment:
      groups:
        - Android_build
      vars:
        PACKAGE_NAME: "com.transportsligneo.driver"
      node: 22
    scripts:
      - name: Installer les dépendances
        script: |
          source $HOME/.nvm/nvm.sh
          nvm install 22
          nvm use 22
          npm install
      - name: Build de l'app web
        script: |
          source $HOME/.nvm/nvm.sh
          nvm use 22
          npm run build
      - name: Synchroniser Capacitor
        script: |
          source $HOME/.nvm/nvm.sh
          nvm use 22
          npx cap sync android
      - name: Générer le bundle Android
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
