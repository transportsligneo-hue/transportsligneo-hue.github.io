workflows:
  android-workflow:
    name: Android Driver App
    max_build_duration: 60
    environment:
      groups:
        - Android_build
      vars:
        PACKAGE_NAME: "com.transportsligneo.driver"
      node: 22
    scripts:
      - name: Diagnostic Node
        script: |
          echo "--- node par défaut ---"
          which node || echo "node introuvable"
          node -v || echo "pas de version"
          echo "--- nvm ---"
          which nvm || echo "nvm introuvable dans PATH"
          ls -la $HOME/.nvm 2>/dev/null || echo "dossier .nvm introuvable"
          echo "--- versions node installées ---"
          ls $HOME/.nvm/versions/node 2>/dev/null || echo "aucune version listée"
      - name: Installer les dépendances
        script: npm install
      - name: Build de l'app web
        script: npm run build
      - name: Synchroniser Capacitor
        script: npx cap sync android
      - name: Générer le bundle Android
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
