workflows:
  android-workflow:
    name: Android Driver App
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - Android_build
      vars:
        PACKAGE_NAME: "com.transportsligneo.driver"
      node: 20
    scripts:
      - name: Installer les dépendances
        script: npm install
      - name: Build de l'app web
        script: npm run build
      - name: Synchroniser Capacitor
        script: npx cap sync android
      - name: Générer le bundle Android
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
