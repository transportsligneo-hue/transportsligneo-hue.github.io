workflows:
  android-workflow:
    name: Android Driver App
    max_build_duration: 60
    environment:
      groups:
        - Android_build
      vars:
        PACKAGE_NAME: "com.transportsligneo.driver"
      node: 22
      java: 21
      android_signing:
        - Ligneo-keystore
    scripts:
      - name: Installer les dépendances
        script: npm install
      - name: Build de l'app web
        script: npm run build
      - name: Synchroniser Capacitor
        script: npx cap sync android
      - name: Générer le bundle Android
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
