<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dcebe3">
<title>Ligneo Driver</title>
<style>
  html,body{margin:0;height:100%;background:#dcebe3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(520px 320px at 0% 0%,rgba(52,230,140,.25),transparent 70%),linear-gradient(180deg,#e6f3ec,#cfe2d8)}
  .m{position:relative;width:104px;height:104px;display:grid;place-items:center}
  .m img{width:68px;height:68px;border-radius:18px;box-shadow:0 10px 26px rgba(20,184,102,.4);animation:b 1.8s ease-in-out infinite}
  .m i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(52,230,140,.5),transparent 68%);animation:b 1.8s ease-in-out infinite}
  @keyframes b{50%{transform:scale(1.08);opacity:.85}}
  strong{font-size:14px;letter-spacing:.16em;color:#0b2a1f;font-weight:800;text-align:center}
  strong em{display:block;font-style:normal;color:#12a35f;letter-spacing:.34em;font-size:11px;margin-top:3px}
  .bar{width:140px;height:5px;border-radius:9px;background:rgba(20,184,102,.18);overflow:hidden}
  .bar b{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,#14B866,#6effcd);animation:l 1.2s ease-in-out infinite}
  @keyframes l{0%{margin-left:-40%}100%{margin-left:100%}}
  a{display:none;position:fixed;bottom:48px;left:50%;transform:translateX(-50%);background:#14B866;color:#04261a;font:700 16px system-ui,sans-serif;padding:14px 22px;border-radius:12px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap"><div class="m"><i></i><img src="/logo-ligneo.png" alt=""></div><strong>TRANSPORTS LIGNEO<em>DRIVER</em></strong><span class="bar"><b></b></span></div>
<a id="manual" href="/login?app=1">Ouvrir la connexion</a>
<script>
(function () {
  // Cache l'écran d'ouverture Android dès que cette page est dessinée (identique : aucune coupure visible).
  function hideSplash() {
    try { var C = window.Capacitor; if (C && C.Plugins && C.Plugins.SplashScreen) C.Plugins.SplashScreen.hide({ fadeOutDuration: 150 }); } catch (e) {}
  }
  window.addEventListener("load", function () { hideSplash(); setTimeout(hideSplash, 300); });
  // Ouvre la connexion tout de suite (l'écran de chargement suivant a le même aspect).
  var go = function () { window.location.replace("/login?app=1"); };
  if (document.readyState === "complete") setTimeout(go, 120);
  else window.addEventListener("load", function () { setTimeout(go, 120); });
  setTimeout(go, 1500);
  setTimeout(function () { document.getElementById("manual").style.display = "inline-block"; }, 6000);
})();
</script>
</body>
</html>
