<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>Ligneo Driver</title>
<script>window.location.replace("/login?app=1");</script>
<style>
  html,body{margin:0;height:100%;background:#0b1026}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center}
  .wrap img{width:96px;height:96px;border-radius:24px;box-shadow:0 12px 40px rgba(79,140,255,.35)}
  a{display:none;position:fixed;bottom:48px;left:50%;transform:translateX(-50%);background:#6ee79a;color:#0b1026;font:700 16px system-ui,sans-serif;padding:14px 22px;border-radius:12px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap"><img src="/logo-ligneo.png" alt=""></div>
<a id="manual" href="/login?app=1">Ouvrir la connexion</a>
<script>setTimeout(function () { document.getElementById("manual").style.display = "inline-block"; }, 5000);</script>
</body>
</html>
